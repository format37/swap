name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swap
          POSTGRES_PASSWORD: swap
          POSTGRES_DB: swap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swap -d swap"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://swap:swap@localhost:5432/swap
      TEST_DATABASE_URL: postgresql+asyncpg://swap:swap@localhost:5432/swap_test
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes full versions only; there is no floating major tag.
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: migrations up, checked against the models, down, and up again
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: eslint and prettier
        run: npm run lint && npm run format:check
      - name: vitest
        run: npx vitest run
      - name: tsc and build
        run: npm run build
      - name: the 300 KB gzip budget
        run: npm run budget

  contract:
    # The generated client must match the api, so a backend change that breaks the
    # frontend fails in the same PR (ADR-0007).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.4"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: export the api's OpenAPI and regenerate the client types
        run: |
          (cd backend && uv sync --locked && uv run python -m swap.tools.openapi > ../frontend/openapi.json)
          (cd frontend && npm ci && npm run gen:api)
      - name: both committed files must be what the api produces
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks over the whole history
        run: >-
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --no-banner --redact --verbose
