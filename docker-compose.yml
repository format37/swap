# The local stack. PR 5 adds caddy, api and worker; for now it is the database
# that the tests and the dev server use.
name: swap

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swap}
      POSTGRES_DB: swap
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swap -d swap"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  db:

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.91.0/24
